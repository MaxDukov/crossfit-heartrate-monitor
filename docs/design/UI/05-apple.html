<!-- Style: Apple/Minimalist -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrossFit · Тренировка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: #000000;
    color: #ffffff;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 22px 28px 14px;
    gap: 16px;
  }

  /* ── Title bar ─────────────────────────────── */
  .titlebar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .titlebar .label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(235,235,245,0.5);
  }
  .titlebar h1 {
    font-size: 28px;
    font-weight: 200;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .titlebar .clock {
    font-size: 15px;
    font-weight: 400;
    color: rgba(235,235,245,0.6);
    letter-spacing: 0.02em;
  }

  /* ── Grid ─────────────────────────────────── */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 18px;
    min-height: 0;
  }

  /* ── Card ─────────────────────────────────── */
  .card {
    container-type: inline-size;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 22px 18px;
    border-radius: 20px;
    background: rgba(28,28,30,0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  }

  /* Zone tints */
  .z1 { --z: #30D158; background: rgba(48,209,88,0.08), rgba(28,28,30,0.8); border-color: rgba(48,209,88,0.18); }
  .z2 { --z: #64D2FF; background: rgba(100,210,255,0.08), rgba(28,28,30,0.8); border-color: rgba(100,210,255,0.18); }
  .z3 { --z: #FFD60A; background: rgba(255,214,10,0.08), rgba(28,28,30,0.8); border-color: rgba(255,214,10,0.18); }
  .z4 { --z: #FF453A; background: rgba(255,69,58,0.10), rgba(28,28,30,0.8); border-color: rgba(255,69,58,0.22); }

  .card .top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .name {
    font-size: clamp(1rem, 4.5cqw, 1.6rem);
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .zone-tag {
    font-size: clamp(0.62rem, 2.2cqw, 0.85rem);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--z);
    text-transform: uppercase;
    opacity: 0.9;
  }

  .bpm {
    font-size: clamp(2.5rem, 26cqw, 16rem);
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .bpm .unit {
    font-size: 0.28em;
    font-weight: 400;
    color: rgba(235,235,245,0.5);
    letter-spacing: 0.04em;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 2px;
  }
  .meta .cal {
    font-size: clamp(0.9rem, 3.4cqw, 1.25rem);
    font-weight: 500;
    color: rgba(235,235,245,0.6);
  }
  .meta .cal b {
    color: #ffffff;
    font-weight: 600;
  }

  /* Activity ring */
  .ring-wrap {
    position: absolute;
    top: 16px;
    right: 16px;
  }

  /* Sparkline */
  .spark {
    width: clamp(80px, 30cqw, 150px);
    height: 26px;
    margin-top: 4px;
    opacity: 0.95;
  }

  /* ── Bottom status bar ────────────────────── */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px 2px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(235,235,245,0.55);
    flex-shrink: 0;
  }
  .statusbar .icons {
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.04em;
  }
  .battery {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .batt-body {
    width: 22px; height: 11px;
    border: 1.4px solid rgba(235,235,245,0.6);
    border-radius: 3px;
    position: relative;
    padding: 1px;
  }
  .batt-body::after {
    content: "";
    position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: rgba(235,235,245,0.6);
    border-radius: 0 2px 2px 0;
  }
  .batt-fill {
    display: block;
    height: 100%;
    width: 92%;
    background: rgba(235,235,245,0.8);
    border-radius: 1px;
  }
  .wifi {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }
  .wifi i {
    display: block;
    width: 3px;
    background: rgba(235,235,245,0.7);
    border-radius: 1px;
  }
  .wifi i:nth-child(1){ height: 4px; }
  .wifi i:nth-child(2){ height: 7px; }
  .wifi i:nth-child(3){ height: 10px; }
</style>
</head>
<body>
