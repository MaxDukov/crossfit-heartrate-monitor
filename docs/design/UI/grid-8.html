<!-- Layout: 8 athletes (4×2) — standard grid -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CF-MONITOR // GRID 8 (4×2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #0F172A;
    color: #E2E8F0;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Title bar ---------- */
  .title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: #0B1220;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    flex: 0 0 auto;
  }

  .title-bar .brand {
    font-weight: 800;
    color: #E2E8F0;
  }

  .title-bar .brand .dot {
    color: #38BDF8;
  }

  .title-bar .clock {
    font-weight: 600;
    color: #94A3B8;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Grid ---------- */
  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }

  /* ---------- Card ---------- */
  .card {
    container-type: inline-size;
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    background: #1E293B;
  }

  /* zone gradients layered behind content */
  .card .zone-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .card.z1 .zone-bg { background: linear-gradient(160deg, rgba(10,138,6,0.18), rgba(10,138,6,0.06)); }
  .card.z2 .zone-bg { background: linear-gradient(160deg, rgba(10,138,6,0.18), rgba(10,138,6,0.06)); }
  .card.z3 .zone-bg { background: linear-gradient(160deg, rgba(234,179,8,0.30), rgba(234,179,8,0.12)); }
  .card.z4 .zone-bg { background: linear-gradient(160deg, rgba(239,68,68,0.30), rgba(239,68,68,0.10)); }

  .card .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 3cqw 4cqw;
  }

  /* ---------- Name ---------- */
  .card .name {
    font-size: clamp(1.2rem, 14cqw, 8rem);
    font-weight: 700;
    line-height: 1;
    color: #F8FAFC;
    letter-spacing: -0.01em;
  }

  /* ---------- BPM block (centered, flex-1) ---------- */
  .card .bpm-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.2em;
  }

  .card .bpm {
    font-size: clamp(2rem, 24cqw, 14rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: #F8FAFC;
  }

  .card.z3 .bpm { color: #FDE68A; }
  .card.z4 .bpm { color: #FCA5A5; }

  .card .heart {
    font-size: 0.8em;
    opacity: 0.6;
    color: #EF4444;
  }

  /* ---------- Calories ---------- */
  .card .calories {
    align-self: center;
    display: flex;
    align-items: center;
    gap: 0.35em;
    font-size: clamp(0.75rem, 8.4cqw, 5.4rem);
    font-weight: 600;
    color: #CBD5E1;
    font-variant-numeric: tabular-nums;
  }

  .card .calories .fire {
    font-size: 0.8em;
    opacity: 0.4;
  }

  /* ---------- Zone bar ---------- */
  .card .zone-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2cqw;
    padding-top: 2cqw;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: clamp(0.7rem, 7cqw, 4.5rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .card .zone-bar .zone-label {
    display: flex;
    align-items: center;
    gap: 0.5em;
  }

  .card .zone-bar .dot {
    width: 1.6cqw;
    height: 1.6cqw;
    border-radius: 50%;
    display: inline-block;
  }

  .card.z1 .zone-bar .dot,
  .card.z2 .zone-bar .dot { background: #0a8a06; box-shadow: 0 0 1.2cqw #0a8a06; }
  .card.z3 .zone-bar .dot { background: #EAB308; box-shadow: 0 0 1.2cqw #EAB308; }
  .card.z4 .zone-bar .dot { background: #EF4444; box-shadow: 0 0 1.2cqw #EF4444; }

  .card .zone-bar .pct {
    color: #94A3B8;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Sparkline ---------- */
  .card .sparkline {
    margin-top: 2cqw;
    width: 100%;
    height: 12cqw;
    display: block;
  }

  .card .sparkline path.line { fill: none; stroke-width: 2; }
  .card.z1 .sparkline path.line,
  .card.z2 .sparkline path.line { stroke: #0a8a06; }
  .card.z3 .sparkline path.line { stroke: #EAB308; }
  .card.z4 .sparkline path.line { stroke: #EF4444; }

  .card .sparkline path.fill { opacity: 0.18; }
  .card.z1 .sparkline path.fill,
  .card.z2 .sparkline path.fill { fill: #0a8a06; }
  .card.z3 .sparkline path.fill { fill: #EAB308; }
  .card.z4 .sparkline path.fill { fill: #EF4444; }
</style>
</head>
<body>

  <div class="title-bar">
    <div class="brand">CF<span class="dot">·</span>MONITOR</div>
    <div class="clock" id="clock">22:30:00</div>
  </div>

  <div class="grid">

    <!-- 1. Анна — Z1 -->
    <div class="card z1">
      <div class="zone-bg"></div>
      <div class="content">

        <div class="bpm-wrap">
          <span class="bpm">68</span><span class="heart">♥</span>
        </div>

        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 1</span>
          <span class="pct">38%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
          <path class="fill" d="M0,24 L8,22 L16,23 L24,20 L32,21 L40,18 L48,19 L56,17 L64,18 L72,16 L80,17 L88,15 L100,16 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,24 L8,22 L16,23 L24,20 L32,21 L40,18 L48,19 L56,17 L64,18 L72,16 L80,17 L88,15 L100,16"></path>

          <path class="fill" d="M0,22 L10,20 L20,21 L30,18 L40,19 L50,15 L60,16 L70,13 L80,14 L90,12 L100,13 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,22 L10,20 L20,21 L30,18 L40,19 L50,15 L60,16 L70,13 L80,14 L90,12 L100,13"></path>
        </svg>

    </div>

    <!-- 3. Вера — Z3 -->
    <div class="card z3">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Вера</div>
        <div class="bpm-wrap">
          <span class="bpm">122</span><span class="heart">♥</span>
        </div>
        <div class="calories">65 <span class="fire">🔥</span></div>
        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 3</span>
          <span class="pct">74%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
          <path class="fill" d="M0,26 L7,24 L14,18 L21,20 L28,12 L35,15 L42,8 L49,11 L56,6 L63,9 L70,7 L77,5 L84,8 L91,4 L100,6 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,26 L7,24 L14,18 L21,20 L28,12 L35,15 L42,8 L49,11 L56,6 L63,9 L70,7 L77,5 L84,8 L91,4 L100,6"></path>
        </svg>
      </div>
    </div>

    <!-- 4. Глеб — Z4 -->
    <div class="card z4">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Глеб</div>
        <div class="bpm-wrap">
          <span class="bpm">155</span><span class="heart">♥</span>
        </div>
        <div class="calories">142 <span class="fire">🔥</span></div>
        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 4</span>
          <span class="pct">91%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
          <path class="fill" d="M0,28 L6,26 L12,18 L18,22 L24,10 L30,14 L36,6 L42,9 L48,4 L54,7 L60,5 L66,8 L72,4 L78,6 L84,3 L90,5 L96,2 L100,4 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,28 L6,26 L12,18 L18,22 L24,10 L30,14 L36,6 L42,9 L48,4 L54,7 L60,5 L66,8 L72,4 L78,6 L84,3 L90,5 L96,2 L100,4"></path>
        </svg>
      </div>
    </div>

    <!-- 5. Дина — Z4 -->
    <div class="card z4">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Дина</div>
        <div class="bpm-wrap">
          <span class="bpm">175</span><span class="heart">♥</span>
        </div>
        <div class="calories">218 <span class="fire">🔥</span></div>
        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 4</span>
          <span class="pct">97%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
          <path class="fill" d="M0,20 L9,14 L18,16 L27,8 L36,10 L45,5 L54,7 L63,3 L72,5 L81,2 L90,4 L100,3 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,20 L9,14 L18,16 L27,8 L36,10 L45,5 L54,7 L63,3 L72,5 L81,2 L90,4 L100,3"></path>
        </svg>
      </div>
    </div>

    <!-- 6. Егор — Z3 -->
    <div class="card z3">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Егор</div>
        <div class="bpm-wrap">
          <span class="bpm">132</span><span class="heart">♥</span>
        </div>
        <div class="calories">96 <span class="fire">🔥</span></div>
        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 3</span>
          <span class="pct">78%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">
          <path class="fill" d="M0,24 L8,20 L16,22 L24,16 L32,18 L40,12 L48,14 L56,9 L64,11 L72,7 L80,9 L88,6 L100,8 L100,30 L0,30 Z"></path>
          <path class="line" d="M0,24 L8,20 L16,22 L24,16 L32,18 L40,12 L48,14 L56,9 L64,11 L72,7 L80,9 L88,6 L100,8"></path>
        </svg>
      </div>
    </div>

    <!-- 7. Жанна — Z2 -->
    <div class="card z2">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Жанна</div>
        <div class="bpm-wrap">
          <span class="bpm">92</span><span class="heart">♥</span>
        </div>
        <div class="calories">35 <span class="fire">🔥</span></div>
        <div class="zone-bar">
          <span class="zone-label"><span class="dot"></span>Зона 2</span>
          <span class="pct">58%</span>
        </div>
        <svg class="sparkline" viewBox="0 0 100 30" preserveAspectRatio="none">

          <path class="line" d="M0,23 L10,25 L20,21 L30,23 L40,19 L50,21 L60,17 L70,19 L80,15 L90,17 L100,14"></path>

    <!-- 8. Захар — Z4 -->
    <div class="card z4">
      <div class="zone-bg"></div>
      <div class="content">
        <div class="name">Захар</div>
        <div class="bpm-wrap">
          <span class="bpm">178</span><span class="heart">♥</span>

        <div class="zone-bar">

        </svg>
      </div>
    </div>

  </div>

  <script>
    function tick() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent =
        p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>
